# MySQL profile. Set DB_USERNAME and DB_PASSWORD in your environment instead of
# writing a real password in the Java source code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vegetable_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Run the idempotent Phase 3 sample data after Hibernate has initialized tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-mysql.sql

# Optional initial Admin account. Keep these values in environment variables.
# The account is created only when the email does not already exist.
app.admin.name=${APP_ADMIN_NAME:Quản trị viên}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Phase 11/12 secure account tokens.
app.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
app.password-reset.demo-link-enabled=${PASSWORD_RESET_DEMO_LINK_ENABLED:false}
app.account-activation.token-hours=${ACCOUNT_ACTIVATION_TOKEN_HOURS:24}

# Phase 21B - optional OpenAI chatbot. Disabled by default so the local 21A
# assistant remains available without a paid API or network connection.
app.chatbot.ai.enabled=${CHATBOT_AI_ENABLED:false}
app.chatbot.ai.api-key=${OPENAI_API_KEY:}
app.chatbot.ai.model=${OPENAI_MODEL:gpt-5.4-nano}
app.chatbot.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.chatbot.ai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:12}
app.chatbot.ai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:500}

# Phase 21C - local, privacy-aware analytics retention.
app.chatbot.analytics.retention-days=${CHATBOT_ANALYTICS_RETENTION_DAYS:30}
