spring.application.name=VegetableShop

# Local receiving account is private and excluded from Git.
spring.config.import=optional:file:./.bank-transfer.local.properties
app.bank-transfer.enabled=${BANK_TRANSFER_ENABLED:false}
app.bank-transfer.bin=${BANK_TRANSFER_BIN:}
app.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:}
app.bank-transfer.account-number=${BANK_TRANSFER_ACCOUNT_NUMBER:}
app.bank-transfer.account-name=${BANK_TRANSFER_ACCOUNT_NAME:}

# Web port. This is separate from the MySQL port (3306).
# Override temporarily with SERVER_PORT if another port is needed.
server.port=${SERVER_PORT:8081}

# Safe default: render the UI without requiring a local database password.
# Use SPRING_PROFILES_ACTIVE=mysql to load Phase 3 data from MySQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:template}

# Disable template cache while developing so HTML changes appear immediately.
spring.thymeleaf.cache=false

# Do not expose raw exception stack traces to browser users.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Phase 19 review photos. Store outside static resources; never expose the directory directly.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=11MB
app.reviews.image-directory=${REVIEW_IMAGE_DIRECTORY:./uploads/reviews}
