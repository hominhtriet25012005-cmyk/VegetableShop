spring.application.name=VegetableShop

# Web port. This is separate from the MySQL port (3306).
# Override temporarily with SERVER_PORT if another port is needed.
server.port=${SERVER_PORT:8081}

# Safe default: render the UI without requiring a local database password.
# Use SPRING_PROFILES_ACTIVE=mysql to load Phase 3 data from MySQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:template}

# Disable template cache while developing so HTML changes appear immediately.
spring.thymeleaf.cache=false

# Do not expose raw exception stack traces to browser users.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
