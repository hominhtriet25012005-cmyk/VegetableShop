<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Vegetable Shop</title>
    <link th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a th:href="@{/}" href="/" class="text-decoration-none">
                    <h2 class="text-primary mb-0">Vegetable Shop</h2>
                </a>
                <a th:href="@{/account}" href="/account" class="btn btn-outline-secondary">Hồ sơ</a>
            </div>
            <div class="bg-white rounded shadow-sm p-4 p-md-5">
                <h4 class="mb-3" th:text="${hasLocalPassword} ? 'Đổi mật khẩu' : 'Tạo mật khẩu đăng nhập'">Đổi mật khẩu</h4>
                <p th:unless="${hasLocalPassword}" class="alert alert-info">
                    Tài khoản Google chưa có mật khẩu cục bộ. Bạn có thể tạo mật khẩu để đăng nhập bằng email.
                </p>
                <div th:if="${passwordChanged}" class="alert alert-success">
                    Mật khẩu đã được cập nhật thành công.
                </div>

                <form th:action="@{/account/change-password}" th:object="${changePasswordRequest}"
                      method="post" novalidate>
                    <div th:if="${hasLocalPassword}" class="mb-3">
                        <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                        <input id="currentPassword" type="password" th:field="*{currentPassword}"
                               class="form-control py-3"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? ' is-invalid'"
                               autocomplete="current-password">
                        <div class="invalid-feedback" th:errors="*{currentPassword}">Mật khẩu hiện tại không đúng</div>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Mật khẩu mới</label>
                        <input id="newPassword" type="password" th:field="*{newPassword}"
                               class="form-control py-3"
                               th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{newPassword}">Lỗi mật khẩu</div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label>
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                               class="form-control py-3"
                               th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('passwordConfirmed')} ? ' is-invalid'"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}">Vui lòng xác nhận mật khẩu</div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordConfirmed')}"
                             th:errors="*{passwordConfirmed}">Mật khẩu không khớp</div>
                    </div>
                    <button type="submit" class="btn btn-primary text-white w-100 py-3">Lưu mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
