<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản của tôi - Vegetable Shop</title>
    <link th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <a th:href="@{/}" href="/" class="text-decoration-none">
                    <h2 class="text-primary mb-0">Vegetable Shop</h2>
                </a>
                <div class="d-flex gap-2">
                    <a th:href="@{/my-orders}" href="/my-orders" class="btn btn-outline-secondary">Đơn hàng</a>
                    <a th:href="@{/shop}" href="/shop" class="btn btn-outline-primary">Sản phẩm</a>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 h-100">
                        <div class="text-center mb-4">
                            <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                                 style="width: 72px; height: 72px; font-size: 1.75rem;"
                                 th:text="${#strings.substring(user.fullName, 0, 1).toUpperCase()}">U</div>
                            <h5 class="mt-3 mb-1" th:text="${user.fullName}">Khách hàng</h5>
                            <p class="text-muted small mb-2" th:text="${user.email}">email@example.com</p>
                            <span class="badge bg-light text-dark" th:if="${user.oauthSubject == null}">Tài khoản email</span>
                            <span class="badge bg-light text-dark" th:if="${user.oauthSubject != null}">Đã liên kết Google</span>
                        </div>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/account}" href="/account" class="list-group-item list-group-item-action active">
                                Thông tin cá nhân
                            </a>
                            <a th:href="@{/account/change-password}" href="/account/change-password"
                               class="list-group-item list-group-item-action">Đổi mật khẩu</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="bg-white rounded shadow-sm p-4 p-md-5">
                        <h4 class="mb-4">Thông tin cá nhân</h4>
                        <div th:if="${profileUpdated}" class="alert alert-success">
                            Cập nhật thông tin thành công.
                        </div>
                        <form th:action="@{/account}" th:object="${profileRequest}" method="post" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email đăng nhập</label>
                                <input id="email" type="email" class="form-control py-3"
                                       th:value="${user.email}" readonly>
                                <div class="form-text">Email là định danh tài khoản nên chưa hỗ trợ thay đổi.</div>
                            </div>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Họ và tên</label>
                                <input id="fullName" type="text" th:field="*{fullName}" class="form-control py-3"
                                       th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'" maxlength="100">
                                <div class="invalid-feedback" th:errors="*{fullName}">Lỗi họ tên</div>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Số điện thoại</label>
                                <input id="phone" type="tel" th:field="*{phone}" class="form-control py-3"
                                       th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'" maxlength="20">
                                <div class="invalid-feedback" th:errors="*{phone}">Lỗi số điện thoại</div>
                            </div>
                            <div class="mb-4">
                                <label for="address" class="form-label">Địa chỉ</label>
                                <textarea id="address" th:field="*{address}" class="form-control" rows="4"
                                          th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'"
                                          maxlength="255"></textarea>
                                <div class="invalid-feedback" th:errors="*{address}">Lỗi địa chỉ</div>
                            </div>
                            <button type="submit" class="btn btn-primary text-white px-4 py-3">Lưu thay đổi</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
