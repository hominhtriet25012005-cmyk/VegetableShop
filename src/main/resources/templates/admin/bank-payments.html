<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đối soát chuyển khoản - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head>
<body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('bank-payments')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
<h1 class="h3">Đối soát chuyển khoản QR</h1><div th:replace="~{admin/fragments :: messages}"></div>
<form method="get" th:action="@{/admin/bank-payments}" class="d-flex gap-2 my-3"><label for="status" class="visually-hidden">Trạng thái thanh toán</label><select id="status" name="status" class="form-select"><option value="">Tất cả trạng thái</option><option th:each="s : ${T(com.vegetableshop.entity.PaymentStatus).values()}" th:value="${s}" th:selected="${selectedStatus == s}" th:text="${s.displayName}"></option></select><button class="btn btn-primary">Lọc</button></form>
<section class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Đơn hàng</th><th>Khách hàng</th><th>Số tiền cần nhận</th><th>Nội dung</th><th>Thanh toán</th><th></th></tr></thead><tbody>
<tr th:each="p : ${payments.content}"><td th:text="${p.order.orderCode}"></td><td th:text="${p.order.user.fullName}"></td><td th:text="${#numbers.formatDecimal(p.amount,0,'POINT',0,'COMMA')+' đ'}"></td><td th:text="${p.reference}"></td><td th:text="${p.order.paymentStatus.displayName}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/bank-payments/{id}(id=${p.order.id})}">Kiểm tra</a></td></tr>
<tr th:if="${payments.empty}"><td colspan="6">Chưa có đơn chuyển khoản phù hợp.</td></tr></tbody></table></div>
<nav class="d-flex gap-3"><a th:if="${payments.hasPrevious()}" th:href="@{/admin/bank-payments(page=${payments.number-1},status=${selectedStatus})}">Trước</a><span th:text="${'Trang '+(payments.number+1)}"></span><a th:if="${payments.hasNext()}" th:href="@{/admin/bank-payments(page=${payments.number+1},status=${selectedStatus})}">Sau</a></nav>
</section></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
