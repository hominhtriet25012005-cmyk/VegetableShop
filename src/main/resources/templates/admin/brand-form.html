<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thương hiệu - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('brands')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-award"></i></span><div><p class="eyebrow mb-1">Thương hiệu</p><h1 class="h3" th:text="${brandId==null?'Thêm thương hiệu':'Sửa thương hiệu'}"></h1></div></div></div><form class="panel mx-auto" style="max-width:850px" th:object="${brandRequest}" th:action="${brandId==null?'/admin/brands':'/admin/brands/'+brandId}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="mb-3"><label class="form-label">Tên thương hiệu</label><input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">URL logo</label><input class="form-control" th:field="*{logo}"><div class="text-danger small" th:errors="*{logo}"></div></div><div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control" rows="4" th:field="*{description}"></textarea><div class="text-danger small" th:errors="*{description}"></div></div><div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Đang hoạt động</label></div><div class="d-flex justify-content-end gap-2"><a class="btn btn-light" th:href="@{/admin/brands}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Lưu thương hiệu</button></div></form></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
