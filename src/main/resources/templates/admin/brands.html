<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thương hiệu - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('brands')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
<div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-award"></i></span><div><p class="eyebrow mb-1">Sản phẩm</p><h1 class="h3 mb-1">Quản lý thương hiệu</h1><p class="text-muted mb-0">Nhãn hiệu hiển thị cho khách hàng, tách biệt với nhà cung cấp.</p></div></div><a class="btn btn-primary" th:href="@{/admin/brands/new}"><i class="bi bi-plus-lg"></i> Thêm thương hiệu</a></div>
<div th:replace="~{admin/fragments :: messages}"></div><section class="panel"><div class="panel-header"><form class="d-flex gap-2 w-100" th:action="@{/admin/brands}" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm thương hiệu"><button class="btn btn-outline-primary" type="submit">Tìm</button><a class="btn btn-light" th:href="@{/admin/brands}">Xóa lọc</a></form></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Logo</th><th>Tên thương hiệu</th><th>Mô tả</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="brand:${brands}"><td><img class="product-thumb" th:src="${brand.logo ?: '/img/hero-img.jpg'}" th:alt="${brand.name}"></td><td class="fw-semibold" th:text="${brand.name}">Tên</td><td class="text-muted" th:text="${brand.description ?: 'Chưa có mô tả'}">Mô tả</td><td><span class="badge" th:classappend="${brand.status}?' text-bg-success':' text-bg-secondary'" th:text="${brand.status?'Hoạt động':'Đã ẩn'}"></span></td><td class="text-end"><a class="btn btn-light btn-sm" th:href="@{/admin/brands/{id}/edit(id=${brand.id})}">Sửa</a> <form class="d-inline" th:action="@{/admin/brands/{id}/toggle(id=${brand.id})}" method="post" data-confirm data-confirm-title="Thay đổi trạng thái thương hiệu?"><button class="btn btn-outline-warning btn-sm" type="submit" th:text="${brand.status?'Ẩn':'Kích hoạt'}"></button></form></td></tr><tr th:if="${#lists.isEmpty(brands)}"><td colspan="5" class="text-center text-muted py-5">Chưa có thương hiệu phù hợp.</td></tr></tbody></table></div></section>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
