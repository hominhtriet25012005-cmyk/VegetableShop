<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh mục - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('categories')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-tags"></i></span><div><p class="eyebrow mb-1">Catalog</p><h1 class="h3">Quản lý danh mục</h1></div></div><a class="btn btn-primary" th:href="@{/admin/categories/new}"><i class="bi bi-plus-lg"></i> Thêm danh mục</a></div><div th:replace="~{admin/fragments :: messages}"></div><section class="panel"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Tên danh mục</th><th>Mô tả</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="category:${categories}"><td th:text="${category.id}">1</td><td class="fw-semibold" th:text="${category.name}">Rau củ</td><td class="text-muted" th:text="${category.description ?: '—'}">Mô tả</td><td><span class="badge" th:classappend="${category.status}?' text-bg-success':' text-bg-secondary'" th:text="${category.status?'Hoạt động':'Đã ẩn'}">Trạng thái</span></td><td class="text-end"><a class="btn btn-light btn-sm" th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Sửa</a><form class="d-inline" th:action="@{/admin/categories/{id}/toggle(id=${category.id})}" method="post"><button class="btn btn-sm" th:classappend="${category.status}?' btn-outline-danger':' btn-outline-success'" th:text="${category.status?'Ẩn':'Kích hoạt'}" type="submit">Ẩn</button></form></td></tr><tr th:if="${#lists.isEmpty(categories)}"><td colspan="5" class="text-center text-muted py-4">Chưa có danh mục</td></tr></tbody></table></div><p class="small text-muted mt-3 mb-0">Danh mục được ẩn thay vì xóa vật lý để không làm lỗi Product đang tham chiếu.</p></section></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
