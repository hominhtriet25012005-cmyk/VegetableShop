<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biểu mẫu danh mục - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('categories')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-pencil-square"></i></span><div><p class="eyebrow mb-1">Category</p><h1 class="h3" th:text="${categoryId == null?'Thêm danh mục':'Sửa danh mục'}">Danh mục</h1></div></div></div><form class="panel" th:object="${categoryRequest}" th:action="${categoryId == null?'/admin/categories':'/admin/categories/'+categoryId}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><div th:each="e:${#fields.globalErrors()}" th:text="${e}">Lỗi</div></div><div class="row g-3"><div class="col-md-8"><label class="form-label">Tên danh mục</label><input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{name}"></div></div><div class="col-md-4"><label class="form-label">Trạng thái</label><div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Hoạt động</label></div></div><div class="col-12"><label class="form-label">Đường dẫn ảnh</label><input class="form-control" th:field="*{image}" placeholder="/img/vegetable-item-1.jpg"><div class="text-danger small" th:errors="*{image}"></div></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="5" th:field="*{description}"></textarea><div class="text-danger small" th:errors="*{description}"></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/admin/categories}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Lưu danh mục</button></div></form></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
