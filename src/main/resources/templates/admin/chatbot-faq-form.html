<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Chatbot - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head>
<body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('chatbot')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
    <div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-chat-square-text"></i></span><div><p class="eyebrow mb-1">FAQ Chatbot</p><h1 class="h3" th:text="${faqId==null?'Thêm FAQ':'Chỉnh sửa FAQ'}">FAQ</h1></div></div></div>
    <form class="panel" th:object="${faqRequest}" th:action="${faqId==null?'/admin/chatbot/faqs':'/admin/chatbot/faqs/'+faqId}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="error:${#fields.globalErrors()}" th:text="${error}"></div>
        <div class="row g-3">
            <div class="col-12"><label class="form-label">Câu hỏi chuẩn</label><input class="form-control" th:field="*{question}" th:classappend="${#fields.hasErrors('question')}?' is-invalid'" placeholder="Ví dụ: Cửa hàng giao hàng trong bao lâu?"><div class="invalid-feedback" th:errors="*{question}"></div></div>
            <div class="col-12"><label class="form-label">Câu trả lời chính thức</label><textarea class="form-control" rows="6" th:field="*{answer}" th:classappend="${#fields.hasErrors('answer')}?' is-invalid'" placeholder="Nội dung ngắn gọn, chính xác và không chứa thông tin bí mật."></textarea><div class="invalid-feedback" th:errors="*{answer}"></div></div>
            <div class="col-md-9"><label class="form-label">Từ khóa / cụm từ kích hoạt</label><input class="form-control" th:field="*{keywords}" th:classappend="${#fields.hasErrors('keywords')}?' is-invalid'" placeholder="giao hàng, vận chuyển, phí ship"><div class="form-text">Phân cách bằng dấu phẩy. Ưu tiên cụm từ rõ nghĩa thay vì một từ quá chung.</div><div class="invalid-feedback" th:errors="*{keywords}"></div></div>
            <div class="col-md-3"><label class="form-label">Thứ tự ưu tiên</label><input class="form-control" type="number" min="0" max="9999" th:field="*{displayOrder}" th:classappend="${#fields.hasErrors('displayOrder')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{displayOrder}"></div></div>
            <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Cho phép chatbot sử dụng FAQ này</label></div></div>
        </div>
        <div class="alert alert-info mt-4 mb-0"><i class="bi bi-info-circle"></i> FAQ hoạt động sẽ được kiểm tra trước khi gọi OpenAI, giúp câu trả lời chính sách nhất quán và giảm chi phí API.</div>
        <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/admin/chatbot/faqs}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Lưu FAQ</button></div>
    </form>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
