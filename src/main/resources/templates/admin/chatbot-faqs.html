<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Chatbot - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head>
<body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('chatbot')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
    <div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-journal-text"></i></span><div><p class="eyebrow mb-1">Chatbot 21C</p><h1 class="h3 mb-1">FAQ chính thức</h1><p class="text-muted mb-0">FAQ khớp từ khóa được ưu tiên trước OpenAI và chatbot 21A.</p></div></div><div class="heading-actions d-flex gap-2"><a class="btn btn-light" th:href="@{/admin/chatbot}">Thống kê</a><a class="btn btn-primary" th:href="@{/admin/chatbot/faqs/new}"><i class="bi bi-plus-lg"></i> Thêm FAQ</a></div></div>
    <div th:replace="~{admin/fragments :: messages}"></div>
    <section class="panel"><div class="panel-header"><form class="d-flex gap-2 w-100" th:action="@{/admin/chatbot/faqs}" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm câu hỏi hoặc từ khóa"><button class="btn btn-outline-primary" type="submit">Tìm</button><a class="btn btn-light" th:href="@{/admin/chatbot/faqs}">Xóa lọc</a></form></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Thứ tự</th><th>Câu hỏi</th><th>Từ khóa</th><th>Trạng thái</th><th>Cập nhật bởi</th><th class="text-end">Thao tác</th></tr></thead><tbody>
        <tr th:each="faq:${faqs}"><td th:text="${faq.displayOrder}">0</td><td><div class="fw-semibold" th:text="${faq.question}">Câu hỏi</div><small class="text-muted chatbot-answer-preview" th:text="${faq.answer}">Trả lời</small></td><td><span class="badge text-bg-secondary text-wrap" th:text="${faq.keywords}">từ khóa</span></td><td><span class="badge" th:classappend="${faq.status}?' text-bg-success':' text-bg-secondary'" th:text="${faq.status?'Đang dùng':'Đang ẩn'}"></span></td><td th:text="${faq.updatedBy}">admin</td><td class="text-end"><a class="btn btn-light btn-sm" th:href="@{/admin/chatbot/faqs/{id}/edit(id=${faq.id})}">Sửa</a> <form class="d-inline" th:action="@{/admin/chatbot/faqs/{id}/toggle(id=${faq.id})}" method="post" data-confirm data-confirm-title="Thay đổi trạng thái FAQ?"><button class="btn btn-outline-warning btn-sm" type="submit" th:text="${faq.status?'Ẩn':'Kích hoạt'}"></button></form></td></tr>
        <tr th:if="${#lists.isEmpty(faqs)}"><td colspan="6" class="text-center text-muted py-5">Chưa có FAQ phù hợp.</td></tr>
    </tbody></table></div></section>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
