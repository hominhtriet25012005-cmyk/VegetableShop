<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết phiếu kho - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('inventoryDocuments')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-file-earmark-check"></i></span><div><p class="eyebrow mb-1" th:text="${document.type.displayName}"></p><h1 class="h3 mb-1" th:text="${document.code}"></h1><p class="text-muted mb-0" th:text="${'Lập bởi '+document.createdBy+' lúc '+#temporals.format(document.createdAt,'dd/MM/yyyy HH:mm')}"></p></div></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-light" th:href="@{/admin/inventory/documents}">Quay lại</a><a class="btn btn-outline-primary" th:if="${document.status.name()=='DRAFT'}" th:href="@{/admin/inventory/documents/{id}/edit(id=${document.id})}"><i class="bi bi-pencil"></i> Sửa phiếu</a></div></div><div th:replace="~{admin/fragments :: messages}"></div>
<section class="row g-3 mb-3"><div class="col-md-3"><article class="metric-card h-100"><div class="metric-label">Trạng thái</div><div class="mt-2"><span class="badge fs-6" th:classappend="${document.status.name()=='POSTED'}?' text-bg-success':' text-bg-warning'" th:text="${document.status.displayName}"></span></div></article></div><div class="col-md-3"><article class="metric-card h-100"><div class="metric-label">Nhà cung cấp</div><div class="fw-semibold mt-2" th:text="${document.supplier==null?'Không áp dụng':document.supplier.name}"></div></article></div><div class="col-md-3"><article class="metric-card h-100"><div class="metric-label">Mã hóa đơn</div><div class="fw-semibold mt-2" th:text="${document.invoiceReference ?: 'Không có'}"></div></article></div><div class="col-md-3"><article class="metric-card h-100"><div class="metric-label">Tổng giá trị nhập</div><div class="fw-semibold mt-2" th:text="${#numbers.formatDecimal(document.totalCost,0,'POINT',0,'COMMA')+' ₫'}"></div></article></div></section>
<section class="panel mb-3"><div class="panel-header"><div><h2 class="h5 mb-1">Chi tiết sản phẩm</h2><p class="text-muted mb-0" th:text="${document.note ?: 'Không có ghi chú'}"></p></div></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>SKU</th><th>Sản phẩm</th><th>Số ghi trên phiếu</th><th>Giá vốn</th><th>Trước</th><th>Thay đổi</th><th>Sau</th></tr></thead><tbody><tr th:each="item:${document.items}"><td class="fw-semibold" th:text="${item.productSku}"></td><td th:text="${item.productName}"></td><td th:text="${item.quantity}"></td><td th:text="${item.unitCost==null?'—':#numbers.formatDecimal(item.unitCost,0,'POINT',0,'COMMA')+' ₫'}"></td><td th:text="${item.quantityBefore==null?'—':item.quantityBefore}"></td><td th:text="${item.quantityChange==null?'—':(item.quantityChange>0?'+'+item.quantityChange:item.quantityChange)}" th:classappend="${item.quantityChange!=null and item.quantityChange>0}?' text-success fw-semibold':' text-danger fw-semibold'"></td><td th:text="${item.quantityAfter==null?'—':item.quantityAfter}"></td></tr></tbody></table></div></section>
<div class="alert alert-success" th:if="${document.status.name()=='POSTED'}"><i class="bi bi-check-circle"></i> Phiếu được xác nhận bởi <strong th:text="${document.postedBy}"></strong> lúc <span th:text="${#temporals.format(document.postedAt,'dd/MM/yyyy HH:mm')}"></span>. Phiếu này không thể sửa hoặc xóa.</div><div class="d-flex justify-content-end gap-2" th:if="${document.status.name()=='DRAFT'}"><form th:action="@{/admin/inventory/documents/{id}/delete(id=${document.id})}" method="post" data-confirm data-confirm-title="Xóa phiếu nháp?" data-confirm-message="Thao tác này chỉ xóa bản nháp và không ảnh hưởng tồn kho."><button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Xóa bản nháp</button></form><form th:action="@{/admin/inventory/documents/{id}/post(id=${document.id})}" method="post" data-confirm data-confirm-title="Xác nhận phiếu kho?" data-confirm-message="Tồn kho sẽ được cập nhật và phiếu không thể sửa hoặc xóa."><button class="btn btn-success" type="submit"><i class="bi bi-check-circle"></i> Xác nhận và cập nhật kho</button></form></div>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
