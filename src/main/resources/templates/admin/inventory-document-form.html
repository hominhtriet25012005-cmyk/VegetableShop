<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lập phiếu kho - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('inventoryDocuments')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-file-earmark-plus"></i></span><div><p class="eyebrow mb-1">Phiếu kho</p><h1 class="h3 mb-1" th:text="${documentId==null?'Tạo phiếu kho':'Sửa phiếu nháp'}"></h1><p class="text-muted mb-0">Lưu nháp chưa làm thay đổi tồn kho.</p></div></div></div>
<form class="panel" th:object="${documentRequest}" th:action="${documentId==null?'/admin/inventory/documents':'/admin/inventory/documents/'+documentId}" method="post" data-inventory-document-form><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><div th:each="e:${#fields.globalErrors()}" th:text="${e}"></div></div><div class="row g-3 mb-4"><div class="col-md-4"><label class="form-label">Loại phiếu</label><select class="form-select" th:field="*{type}" data-document-type><option th:each="value:${documentTypes}" th:value="${value}" th:text="${value.displayName}"></option></select></div><div class="col-md-8" data-supplier-field><label class="form-label">Nhà cung cấp <span class="text-danger">*</span></label><select class="form-select" th:field="*{supplierId}"><option value="">Chọn nhà cung cấp</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.code+' - '+s.name+(!s.status?' (ngừng hợp tác)':'')}" th:disabled="${!s.status}"></option></select></div><div class="col-md-5"><label class="form-label">Mã hóa đơn/tham chiếu</label><input class="form-control" th:field="*{invoiceReference}" placeholder="VD: HD-2026-001"></div><div class="col-md-7"><label class="form-label">Ghi chú</label><input class="form-control" th:field="*{note}" placeholder="Lý do nhập, xuất hoặc kiểm kê"></div></div>
<div class="d-flex justify-content-between align-items-center mb-2"><div><h2 class="h5 mb-1">Chi tiết phiếu</h2><p class="text-muted small mb-0">Một sản phẩm chỉ xuất hiện một lần trong phiếu.</p></div><button class="btn btn-outline-primary btn-sm" type="button" data-add-inventory-row><i class="bi bi-plus-lg"></i> Thêm dòng</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th style="min-width:300px">Sản phẩm/SKU</th><th style="width:170px" data-quantity-heading>Số lượng</th><th style="width:190px" data-cost-heading>Giá vốn nhập</th><th style="width:70px"></th></tr></thead><tbody data-inventory-rows><tr th:each="item,stat:*{items}" data-inventory-row><td><select class="form-select" th:field="*{items[__${stat.index}__].productId}" required><option value="">Chọn sản phẩm</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.sku+' - '+p.name+' (tồn '+p.quantity+' '+p.unit.symbol+')'}"></option></select></td><td><input class="form-control" type="number" min="0" max="1000000" th:field="*{items[__${stat.index}__].quantity}" required></td><td><input class="form-control" type="number" min="0" step="1000" th:field="*{items[__${stat.index}__].unitCost}" data-unit-cost></td><td><button class="btn btn-outline-danger btn-sm" type="button" data-remove-inventory-row title="Xóa dòng"><i class="bi bi-trash"></i></button></td></tr></tbody></table></div>
<template data-inventory-row-template><tr data-inventory-row><td><select class="form-select" name="items[__INDEX__].productId" required><option value="">Chọn sản phẩm</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.sku+' - '+p.name+' (tồn '+p.quantity+' '+p.unit.symbol+')'}"></option></select></td><td><input class="form-control" type="number" min="0" max="1000000" name="items[__INDEX__].quantity" required></td><td><input class="form-control" type="number" min="0" step="1000" name="items[__INDEX__].unitCost" data-unit-cost></td><td><button class="btn btn-outline-danger btn-sm" type="button" data-remove-inventory-row><i class="bi bi-trash"></i></button></td></tr></template>
<div class="alert alert-warning mt-3"><i class="bi bi-shield-exclamation"></i> Phiếu chỉ cập nhật tồn sau khi được xác nhận. Phiếu đã xác nhận không thể sửa hoặc xóa.</div><div class="d-flex justify-content-end gap-2"><a class="btn btn-light" th:href="${documentId==null?'/admin/inventory/documents':'/admin/inventory/documents/'+documentId}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Lưu bản nháp</button></div></form>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script><script th:src="@{/admin/js/inventory-document.js}"></script></body></html>
