<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu kho - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('inventoryDocuments')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
<div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-file-earmark-text"></i></span><div><p class="eyebrow mb-1">Kho &amp; nhập hàng</p><h1 class="h3 mb-1" th:text="${selectedProduct == null ? 'Phiếu kho' : 'Phiếu kho của ' + selectedProduct.name}">Phiếu kho</h1><p class="text-muted mb-0" th:if="${selectedProduct == null}">Phiếu nháp có thể sửa; phiếu đã xác nhận là chứng từ bất biến.</p><p class="text-muted mb-0" th:if="${selectedProduct != null}" th:text="${selectedProduct.sku + ' · Hiển thị toàn bộ phiếu có sản phẩm này.'}"></p></div></div><a class="btn btn-primary" th:if="${selectedProduct == null}" th:href="@{/admin/inventory/documents/new}"><i class="bi bi-plus-lg"></i> Tạo phiếu kho</a><a class="btn btn-primary" th:if="${selectedProduct != null}" th:href="@{/admin/inventory/documents/new(type='INBOUND',productId=${selectedProduct.id})}"><i class="bi bi-plus-lg"></i> Nhập mới sản phẩm này</a></div>
<div th:replace="~{admin/fragments :: messages}"></div><section class="panel mb-3"><form class="row g-2 align-items-end" th:action="@{/admin/inventory/documents}" method="get"><div class="col-lg-3"><label class="form-label">Mã phiếu / hóa đơn</label><input class="form-control" name="keyword" th:value="${keyword}" placeholder="PN-... hoặc mã hóa đơn"></div><div class="col-lg-3"><label class="form-label">Sản phẩm</label><select class="form-select" name="productId"><option value="">Tất cả sản phẩm</option><option th:each="product:${products}" th:value="${product.id}" th:text="${product.sku+' - '+product.name}" th:selected="${selectedProductId!=null and product.id==selectedProductId}"></option></select></div><div class="col-sm-6 col-lg-2"><label class="form-label">Loại phiếu</label><select class="form-select" name="type"><option value="">Tất cả</option><option th:each="value:${documentTypes}" th:value="${value}" th:text="${value.displayName}" th:selected="${selectedType==value}"></option></select></div><div class="col-sm-6 col-lg-2"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="">Tất cả</option><option th:each="value:${documentStatuses}" th:value="${value}" th:text="${value.displayName}" th:selected="${selectedStatus==value}"></option></select></div><div class="col-lg-4"><label class="form-label">Nhà cung cấp</label><select class="form-select" name="supplierId"><option value="">Tất cả</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.code+' - '+s.name}" th:selected="${selectedSupplierId==s.id}"></option></select></div><div class="col-lg-2 d-flex gap-2"><button class="btn btn-outline-primary flex-grow-1" type="submit">Lọc</button><a class="btn btn-light" th:href="@{/admin/inventory/documents}">Xóa</a></div></form></section>
<section class="panel"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Mã phiếu</th><th>Loại</th><th>Nhà cung cấp</th><th>Số mặt hàng</th><th>Tổng số lượng</th><th>Người lập</th><th>Trạng thái</th><th>Ngày lập</th><th></th></tr></thead><tbody><tr th:each="document:${documentPage.content}"><td class="fw-semibold" th:text="${document.code}"></td><td th:text="${document.type.displayName}"></td><td th:text="${document.supplier==null?'—':document.supplier.name}"></td><td th:text="${document.items.size()}"></td><td th:text="${document.totalQuantity}"></td><td th:text="${document.createdBy}"></td><td><span class="badge" th:classappend="${document.status.name()=='POSTED'}?' text-bg-success':' text-bg-warning'" th:text="${document.status.displayName}"></span></td><td class="text-nowrap" th:text="${#temporals.format(document.createdAt,'dd/MM/yyyy HH:mm')}"></td><td class="text-end"><a class="btn btn-light btn-sm" th:href="@{/admin/inventory/documents/{id}(id=${document.id})}">Chi tiết</a></td></tr><tr th:if="${documentPage.empty}"><td colspan="9" class="text-center text-muted py-5" th:text="${selectedProduct == null ? 'Chưa có phiếu kho phù hợp.' : 'Sản phẩm này chưa xuất hiện trong phiếu kho nào.'}">Chưa có phiếu kho phù hợp.</td></tr></tbody></table></div><nav class="mt-3" th:if="${documentPage.totalPages>1}"><ul class="pagination mb-0"><li class="page-item" th:classappend="${documentPage.first}?' disabled'"><a class="page-link" th:href="@{/admin/inventory/documents(keyword=${keyword},productId=${selectedProductId},type=${selectedType},status=${selectedStatus},supplierId=${selectedSupplierId},page=${documentPage.number-1})}">Trước</a></li><li class="page-item disabled"><span class="page-link" th:text="${documentPage.number+1+' / '+documentPage.totalPages}"></span></li><li class="page-item" th:classappend="${documentPage.last}?' disabled'"><a class="page-link" th:href="@{/admin/inventory/documents(keyword=${keyword},productId=${selectedProductId},type=${selectedType},status=${selectedStatus},supplierId=${selectedSupplierId},page=${documentPage.number+1})}">Sau</a></li></ul></nav></section>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
