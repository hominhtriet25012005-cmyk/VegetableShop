<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cập nhật kho - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head>
<body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('inventory')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
    <div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-arrow-left-right"></i></span><div><p class="eyebrow mb-1">Quản lý kho</p><h1 class="h3 mb-1" th:text="${product.productName}">Sản phẩm</h1><p class="text-muted mb-0" th:text="${'Tồn hiện tại: '+product.quantity+' · Ngưỡng cảnh báo: '+product.lowStockThreshold}">Tồn hiện tại</p></div></div></div>
    <form class="panel mx-auto" style="max-width:760px" th:object="${movementRequest}" th:action="@{/admin/inventory/{id}/movement(id=${product.productId})}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Lỗi nghiệp vụ kho</div></div>
        <div class="mb-3"><label class="form-label" for="movementType">Nghiệp vụ</label><select id="movementType" class="form-select" th:field="*{movementType}" th:classappend="${#fields.hasErrors('movementType')} ? ' is-invalid'"><option th:each="type : ${manualMovementTypes}" th:value="${type}" th:text="${type.displayName}">Loại</option></select><div class="invalid-feedback" th:errors="*{movementType}"></div></div>
        <div class="mb-3"><label class="form-label" for="quantity">Số lượng</label><input id="quantity" class="form-control" type="number" min="0" max="1000000" th:field="*{quantity}" th:classappend="${#fields.hasErrors('quantity')} ? ' is-invalid'" autofocus><div class="invalid-feedback" th:errors="*{quantity}"></div><div class="form-text">Nhập/Xuất: số đơn vị thay đổi. Điều chỉnh kiểm kê: nhập số tồn thực tế sau kiểm đếm.</div></div>
        <div class="mb-4"><label class="form-label" for="reason">Lý do</label><textarea id="reason" class="form-control" rows="4" maxlength="500" th:field="*{reason}" th:classappend="${#fields.hasErrors('reason')} ? ' is-invalid'" placeholder="Ví dụ: Nhập hàng từ nhà cung cấp, hàng hỏng, kiểm kê cuối tháng..."></textarea><div class="invalid-feedback" th:errors="*{reason}"></div></div>
        <div class="alert alert-info"><i class="bi bi-shield-check"></i> Sau khi xác nhận, hệ thống sẽ lưu tồn trước, tồn sau, người thực hiện và thời gian vào lịch sử kho.</div>
        <div class="d-flex justify-content-end gap-2"><a class="btn btn-light" th:href="@{/admin/inventory}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-circle"></i> Xác nhận cập nhật kho</button></div>
    </form>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
