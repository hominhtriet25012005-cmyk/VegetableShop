<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết đơn - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-receipt-cutoff"></i></span><div><p class="eyebrow mb-1">Order Detail</p><h1 class="h3 mb-1" th:text="${order.orderCode}">VS-...</h1><p class="text-muted mb-0" th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}">Ngày</p></div></div><a class="btn btn-light" th:href="@{/admin/orders}">Quay lại</a></div><div th:replace="~{admin/fragments :: messages}"></div><div class="row g-3"><div class="col-xl-8"><section class="panel"><h2 class="h5 section-title"><i class="bi bi-bag"></i><span>Sản phẩm đã đặt</span></h2><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="detail:${order.details}"><td th:text="${detail.productName}">Tên</td><td th:text="${#numbers.formatDecimal(detail.price,0,'POINT',0,'COMMA')+' ₫'}">0</td><td th:text="${detail.quantity}">1</td><td th:text="${#numbers.formatDecimal(detail.subtotal,0,'POINT',0,'COMMA')+' ₫'}">0</td></tr></tbody><tfoot><tr><th colspan="3" class="text-end">Tổng cộng</th><th class="text-primary" th:text="${#numbers.formatDecimal(order.totalAmount,0,'POINT',0,'COMMA')+' ₫'}">0</th></tr></tfoot></table></div></section></div><div class="col-xl-4"><section class="panel mb-3"><h2 class="h5">Giao hàng</h2><p class="fw-semibold mb-1" th:text="${order.receiverName}">Người nhận</p><p class="mb-1" th:text="${order.receiverPhone}">SĐT</p><p class="mb-1" th:text="${order.shippingAddress}">Địa chỉ</p><p class="text-muted small mb-0" th:if="${order.note}" th:text="${'Ghi chú: '+order.note}">Ghi chú</p></section><section class="panel"><h2 class="h5">Trạng thái</h2><p>Đơn hàng: <strong class="text-primary" th:text="${order.status}">PENDING</strong></p><p>Thanh toán: <strong th:text="${order.paymentMethod+' / '+order.paymentStatus}">COD</strong></p><form th:if="${!#lists.isEmpty(allowedStatuses)}" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><label class="form-label">Chuyển sang</label><select class="form-select mb-3" name="status" required><option value="">Chọn trạng thái</option><option th:each="s:${allowedStatuses}" th:value="${s}" th:text="${s}"></option></select><button class="btn btn-primary w-100" type="submit" onclick="return confirm('Xác nhận cập nhật trạng thái?')">Cập nhật trạng thái</button></form><div th:if="${#lists.isEmpty(allowedStatuses)}" class="alert alert-secondary mb-0">Đơn đã ở trạng thái kết thúc.</div><p class="small text-muted mt-3 mb-0" th:if="${order.status.name() == 'PENDING'}">Hủy đơn sẽ tự động hoàn lại tồn kho.</p></section></div></div></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
