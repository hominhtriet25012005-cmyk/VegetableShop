<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn hàng - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-receipt"></i></span><div><p class="eyebrow mb-1">Sales</p><h1 class="h3">Quản lý đơn hàng</h1></div></div></div><div th:replace="~{admin/fragments :: messages}"></div><section class="panel"><div class="panel-header"><form class="row g-2 w-100" th:action="@{/admin/orders}" method="get"><div class="col-md-6"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Mã đơn, tên hoặc email khách hàng"></div><div class="col-md-3"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="s:${orderStatuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option></select></div><div class="col-md-3 d-flex gap-2"><button class="btn btn-outline-primary" type="submit">Lọc</button><a class="btn btn-light" th:href="@{/admin/orders}">Xóa lọc</a></div></form></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Trạng thái</th><th>Thanh toán</th><th>Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="order:${orderPage.content}"><td class="fw-semibold" th:text="${order.orderCode}">VS-...</td><td><span th:text="${order.user.fullName}">Khách</span><small class="d-block text-muted" th:text="${order.user.email}">email</small></td><td th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}">Ngày</td><td><span class="badge text-bg-secondary" th:text="${order.status}">PENDING</span></td><td th:text="${order.paymentStatus}">UNPAID</td><td class="fw-semibold" th:text="${#numbers.formatDecimal(order.totalAmount,0,'POINT',0,'COMMA')+' ₫'}">0 ₫</td><td><a class="btn btn-light btn-sm" th:href="@{/admin/orders/{id}(id=${order.id})}">Chi tiết</a></td></tr><tr th:if="${orderPage.empty}"><td colspan="7" class="text-center text-muted py-4">Không tìm thấy đơn hàng</td></tr></tbody></table></div><nav th:if="${orderPage.totalPages>1}" class="mt-3"><ul class="pagination mb-0"><li class="page-item" th:classappend="${orderPage.first}?' disabled'"><a class="page-link" th:href="@{/admin/orders(keyword=${keyword},status=${selectedStatus},page=${orderPage.number-1})}">Trước</a></li><li class="page-item disabled"><span class="page-link" th:text="${(orderPage.number+1)+' / '+orderPage.totalPages}"></span></li><li class="page-item" th:classappend="${orderPage.last}?' disabled'"><a class="page-link" th:href="@{/admin/orders(keyword=${keyword},status=${selectedStatus},page=${orderPage.number+1})}">Sau</a></li></ul></nav></section></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
