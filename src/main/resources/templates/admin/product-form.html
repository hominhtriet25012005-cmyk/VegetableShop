<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Biểu mẫu sản phẩm - Admin</title>
    <link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.css" rel="stylesheet">
    <link th:href="@{/admin/css/style.css}" rel="stylesheet">
</head>
<body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div>
<aside th:replace="~{admin/fragments :: sidebar('products')}"></aside><div class="admin-main">
<nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4">
    <div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-pencil-square"></i></span><div><p class="eyebrow mb-1">Danh mục sản phẩm</p><h1 class="h3" th:text="${productId == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}">Sản phẩm</h1></div></div></div>
    <form class="panel" th:object="${productRequest}" th:action="${productId == null ? '/admin/products' : '/admin/products/'+productId}" method="post">
        <input th:if="${productId != null}" type="hidden" name="returnKeyword" th:value="${returnKeyword}">
        <input th:if="${productId != null}" type="hidden" name="returnCategoryId" th:value="${returnCategoryId}">
        <input th:if="${productId != null}" type="hidden" name="returnBrandId" th:value="${returnBrandId}">
        <input th:if="${productId != null}" type="hidden" name="returnStatus" th:value="${returnStatus}">
        <input th:if="${productId != null}" type="hidden" name="returnPage" th:value="${returnPage}">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><div th:each="e:${#fields.globalErrors()}" th:text="${e}">Lỗi</div></div>
        <div class="alert alert-info" th:if="${productId == null}"><i class="bi bi-info-circle"></i> Sản phẩm mới được tạo với tồn kho bằng 0. Hãy lập phiếu nhập kho sau khi lưu.</div>
        <div class="alert alert-light border" th:if="${productId != null}"><i class="bi bi-boxes"></i> Tồn hiện tại: <strong th:text="*{quantity}">0</strong>. Số tồn chỉ được thay đổi bằng phiếu kho.</div>
        <div class="row g-3">
            <div class="col-md-3"><label class="form-label">SKU</label><input class="form-control text-uppercase" th:field="*{sku}" placeholder="VD: RAU-CAROT-01" th:classappend="${#fields.hasErrors('sku')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{sku}"></div></div>
            <div class="col-md-9"><label class="form-label">Tên sản phẩm</label><input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{name}"></div></div>
            <div class="col-md-4"><label class="form-label">Danh mục</label><select class="form-select" th:field="*{categoryId}" th:classappend="${#fields.hasErrors('categoryId')}?' is-invalid'"><option value="">Chọn danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name+(!c.status?' (đã ẩn)':'')}"></option></select><div class="invalid-feedback" th:errors="*{categoryId}"></div></div>
            <div class="col-md-4"><label class="form-label">Thương hiệu</label><select class="form-select" th:field="*{brandId}"><option value="">Không thương hiệu</option><option th:each="b:${brands}" th:value="${b.id}" th:text="${b.name+(!b.status?' (đã ẩn)':'')}"></option></select></div>
            <div class="col-md-4"><label class="form-label">Đơn vị bán</label><select class="form-select" th:field="*{unit}" th:classappend="${#fields.hasErrors('unit')}?' is-invalid'"><option th:each="u:${productUnits}" th:value="${u}" th:text="${u.displayName+' ('+u.symbol+')'}"></option></select><div class="invalid-feedback" th:errors="*{unit}"></div></div>
            <div class="col-md-4"><label class="form-label">Giá bán</label><input class="form-control" type="number" min="0" step="1000" th:field="*{price}" th:classappend="${#fields.hasErrors('price')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{price}"></div></div>
            <div class="col-md-4"><label class="form-label">Xuất xứ</label><input class="form-control" th:field="*{origin}" placeholder="VD: Đà Lạt, Việt Nam"><div class="text-danger small" th:errors="*{origin}"></div></div>
            <div class="col-md-2"><label class="form-label">Ngưỡng tồn thấp</label><input class="form-control" type="number" min="0" th:field="*{lowStockThreshold}" th:classappend="${#fields.hasErrors('lowStockThreshold')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{lowStockThreshold}"></div></div>
            <div class="col-md-2"><label class="form-label">Trạng thái</label><div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Đang bán</label></div></div>
            <div class="col-12"><label class="form-label">Ảnh đại diện</label><input class="form-control" th:field="*{image}" placeholder="https://... hoặc /img/..."><div class="text-danger small" th:errors="*{image}"></div></div>
            <div class="col-12"><label class="form-label">Ảnh phụ</label><textarea class="form-control" rows="4" th:field="*{additionalImageUrls}" placeholder="Mỗi dòng một URL ảnh, tối đa 8 ảnh"></textarea><div class="form-text">Ảnh phụ sẽ được sử dụng cho thư viện ảnh ở Giai đoạn 18B.</div><div class="text-danger small" th:errors="*{additionalImageUrls}"></div></div>
            <div class="col-12"><label class="form-label" for="productDescription">Mô tả chi tiết</label><textarea id="productDescription" class="form-control" rows="8" th:field="*{description}" data-rich-text-editor></textarea><div class="form-text">Nội dung không an toàn sẽ tự động bị loại bỏ.</div><div class="text-danger small" th:errors="*{description}"></div></div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:if="${productId == null}" th:href="@{/admin/products}">Hủy</a><a class="btn btn-light" th:if="${productId != null}" th:href="@{/admin/products(keyword=${returnKeyword},categoryId=${returnCategoryId},brandId=${returnBrandId},status=${returnStatus},page=${returnPage})} + '#product-' + ${productId}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Lưu sản phẩm</button></div>
    </form>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div>
<script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.js"></script><script th:src="@{/admin/js/main.js}"></script><script th:src="@{/admin/js/product-editor.js}"></script>
</body></html>
