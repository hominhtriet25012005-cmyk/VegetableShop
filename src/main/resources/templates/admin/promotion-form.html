<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khuyến mãi - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('discounts')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div><p class="eyebrow mb-1">Khuyến mãi</p><h1 class="h3" th:text="${promotionId==null?'Tạo chương trình':'Sửa chương trình'}"></h1></div></div>
<form class="panel" th:object="${promotionRequest}" method="post" th:action="${promotionId==null?'/admin/discounts/promotions':'/admin/discounts/promotions/'+promotionId}"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="e:${#fields.allErrors()}" th:text="${e}"></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên chương trình</label><input class="form-control" th:field="*{name}"></div><div class="col-md-3"><label class="form-label">Loại giảm</label><select class="form-select" th:field="*{discountType}"><option th:each="x:${discountTypes}" th:value="${x}" th:text="${x.displayName}"></option></select></div><div class="col-md-3"><label class="form-label">Giá trị</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{discountValue}"></div><div class="col-md-6"><label class="form-label">Bắt đầu</label><input class="form-control" type="datetime-local" th:field="*{startsAt}"></div><div class="col-md-6"><label class="form-label">Kết thúc</label><input class="form-control" type="datetime-local" th:field="*{endsAt}"></div><div class="col-12"><label class="form-label">Sản phẩm áp dụng</label><select class="form-select" multiple size="14" th:field="*{productIds}"><option th:each="x:${products}" th:value="${x.id}" th:text="${x.sku+' - '+x.name+' · '+#numbers.formatDecimal(x.price,0,'POINT',0,'COMMA')+' ₫'}"></option></select><div class="form-text">Giữ Ctrl để chọn nhiều sản phẩm.</div></div><div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{flashSale}"><label class="form-check-label">Hiển thị nhãn Flash Sale</label></div></div><div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Kích hoạt</label></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/admin/discounts}">Hủy</a><button class="btn btn-primary">Lưu chương trình</button></div></form>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
