<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhà cung cấp - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('suppliers')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-truck"></i></span><div><p class="eyebrow mb-1">Nhà cung cấp</p><h1 class="h3" th:text="${supplierId==null?'Thêm nhà cung cấp':'Sửa nhà cung cấp'}"></h1></div></div></div><form class="panel" th:object="${supplierRequest}" th:action="${supplierId==null?'/admin/suppliers':'/admin/suppliers/'+supplierId}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="row g-3"><div class="col-md-4"><label class="form-label">Mã nhà cung cấp</label><input class="form-control text-uppercase" th:field="*{code}" th:classappend="${#fields.hasErrors('code')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{code}"></div></div><div class="col-md-8"><label class="form-label">Tên đơn vị</label><input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{name}"></div></div><div class="col-md-4"><label class="form-label">Người liên hệ</label><input class="form-control" th:field="*{contactPerson}"></div><div class="col-md-4"><label class="form-label">Điện thoại</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-4"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')}?' is-invalid'"><div class="invalid-feedback" th:errors="*{email}"></div></div><div class="col-md-8"><label class="form-label">Địa chỉ</label><input class="form-control" th:field="*{address}"></div><div class="col-md-4"><label class="form-label">Mã số thuế</label><input class="form-control" th:field="*{taxCode}"></div><div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Đang hợp tác</label></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/admin/suppliers}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Lưu nhà cung cấp</button></div></form></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
