<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhà cung cấp - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('suppliers')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-truck"></i></span><div><p class="eyebrow mb-1">Kho &amp; nhập hàng</p><h1 class="h3 mb-1">Nhà cung cấp</h1><p class="text-muted mb-0">Đối tác cung ứng được chọn khi lập phiếu nhập kho.</p></div></div><a class="btn btn-primary" th:href="@{/admin/suppliers/new}"><i class="bi bi-plus-lg"></i> Thêm nhà cung cấp</a></div><div th:replace="~{admin/fragments :: messages}"></div><section class="panel"><div class="panel-header"><form class="d-flex gap-2 w-100" th:action="@{/admin/suppliers}" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo mã hoặc tên"><button class="btn btn-outline-primary">Tìm</button><a class="btn btn-light" th:href="@{/admin/suppliers}">Xóa lọc</a></form></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Mã NCC</th><th>Tên đơn vị</th><th>Người liên hệ</th><th>Điện thoại / Email</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="supplier:${suppliers}"><td class="fw-semibold" th:text="${supplier.code}">NCC</td><td><div class="fw-semibold" th:text="${supplier.name}"></div><small class="text-muted" th:text="${supplier.taxCode==null?'Chưa có MST':'MST: '+supplier.taxCode}"></small></td><td th:text="${supplier.contactPerson ?: 'Chưa xác định'}"></td><td><div th:text="${supplier.phone ?: '—'}"></div><small class="text-muted" th:text="${supplier.email ?: '—'}"></small></td><td><span class="badge" th:classappend="${supplier.status}?' text-bg-success':' text-bg-secondary'" th:text="${supplier.status?'Đang hợp tác':'Ngừng hợp tác'}"></span></td><td class="text-end"><a class="btn btn-light btn-sm" th:href="@{/admin/suppliers/{id}/edit(id=${supplier.id})}">Sửa</a> <form class="d-inline" th:action="@{/admin/suppliers/{id}/toggle(id=${supplier.id})}" method="post" data-confirm data-confirm-title="Thay đổi trạng thái nhà cung cấp?"><button class="btn btn-outline-warning btn-sm" type="submit" th:text="${supplier.status?'Ngừng':'Kích hoạt'}"></button></form></td></tr><tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="6" class="text-center text-muted py-5">Chưa có nhà cung cấp phù hợp.</td></tr></tbody></table></div></section></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
