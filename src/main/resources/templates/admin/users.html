<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Người dùng - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><div class="sidebar-backdrop" data-sidebar-close></div><aside th:replace="~{admin/fragments :: sidebar('users')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div class="page-heading-copy"><span class="page-icon"><i class="bi bi-people"></i></span><div><p class="eyebrow mb-1">Accounts</p><h1 class="h3">Quản lý người dùng</h1><p class="text-muted mb-0">Mật khẩu không bao giờ được hiển thị.</p></div></div></div><div th:replace="~{admin/fragments :: messages}"></div><section class="panel"><div class="panel-header"><form class="d-flex gap-2 w-100" th:action="@{/admin/users}" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo họ tên hoặc email"><button class="btn btn-outline-primary" type="submit">Tìm</button><a class="btn btn-light" th:href="@{/admin/users}">Xóa lọc</a></form></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="user:${userPage.content}"><td th:text="${user.id}">1</td><td class="fw-semibold" th:text="${user.fullName}">Tên</td><td th:text="${user.email}">Email</td><td th:text="${user.phone ?: '—'}">SĐT</td><td><span class="badge text-bg-info" th:text="${user.role}">USER</span></td><td><span class="badge" th:classappend="${user.status}?' text-bg-success':' text-bg-danger'" th:text="${user.status?'Hoạt động':'Đã khóa'}">Trạng thái</span></td><td class="text-end"><form th:if="${user.role.name() == 'USER'}" th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post"><button class="btn btn-sm" th:classappend="${user.status}?' btn-outline-danger':' btn-outline-success'" th:text="${user.status?'Khóa':'Mở khóa'}" type="submit" onclick="return confirm('Xác nhận thay đổi trạng thái tài khoản?')">Khóa</button></form><span th:if="${user.role.name() == 'ADMIN'}" class="text-muted small">Được bảo vệ</span></td></tr><tr th:if="${userPage.empty}"><td colspan="7" class="text-center text-muted py-4">Không tìm thấy tài khoản</td></tr></tbody></table></div><nav th:if="${userPage.totalPages>1}" class="mt-3"><ul class="pagination mb-0"><li class="page-item" th:classappend="${userPage.first}?' disabled'"><a class="page-link" th:href="@{/admin/users(keyword=${keyword},page=${userPage.number-1})}">Trước</a></li><li class="page-item disabled"><span class="page-link" th:text="${(userPage.number+1)+' / '+userPage.totalPages}"></span></li><li class="page-item" th:classappend="${userPage.last}?' disabled'"><a class="page-link" th:href="@{/admin/users(keyword=${keyword},page=${userPage.number+1})}">Sau</a></li></ul></nav></section></div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script></body></html>
