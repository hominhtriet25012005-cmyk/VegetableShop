<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voucher - Admin</title><link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet"><link th:href="@{/admin/css/style.css}" rel="stylesheet"></head><body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('discounts')}"></aside><div class="admin-main"><nav th:replace="~{admin/fragments :: topbar}"></nav><main class="dashboard-content"><div class="container-fluid px-3 px-lg-4 py-4"><div class="page-heading"><div><p class="eyebrow mb-1">Voucher</p><h1 class="h3" th:text="${voucherId==null?'Tạo voucher':'Sửa voucher'}"></h1></div></div>
<form class="panel" th:object="${voucherRequest}" method="post" th:action="${voucherId==null?'/admin/discounts/vouchers':'/admin/discounts/vouchers/'+voucherId}"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="e:${#fields.allErrors()}" th:text="${e}"></div></div><div class="row g-3"><div class="col-md-4"><label class="form-label">Mã voucher</label><input class="form-control text-uppercase" th:field="*{code}"><div class="text-danger small" th:errors="*{code}"></div></div><div class="col-md-8"><label class="form-label">Tên chương trình</label><input class="form-control" th:field="*{name}"></div>
<div class="col-md-3"><label class="form-label">Loại giảm</label><select class="form-select" th:field="*{discountType}"><option th:each="x:${discountTypes}" th:value="${x}" th:text="${x.displayName}"></option></select></div><div class="col-md-3"><label class="form-label">Giá trị giảm</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{discountValue}"></div><div class="col-md-3"><label class="form-label">Đơn tối thiểu</label><input class="form-control" type="number" min="0" step="1000" th:field="*{minimumOrderAmount}"></div><div class="col-md-3"><label class="form-label">Giảm tối đa</label><input class="form-control" type="number" min="0" step="1000" th:field="*{maximumDiscountAmount}" placeholder="Không giới hạn"></div>
<div class="col-md-6"><label class="form-label">Bắt đầu</label><input class="form-control" type="datetime-local" th:field="*{startsAt}"></div><div class="col-md-6"><label class="form-label">Kết thúc</label><input class="form-control" type="datetime-local" th:field="*{endsAt}"></div><div class="col-md-4"><label class="form-label">Tổng lượt dùng</label><input class="form-control" type="number" min="1" th:field="*{totalUsageLimit}" placeholder="Không giới hạn"></div><div class="col-md-4"><label class="form-label">Lượt/khách</label><input class="form-control" type="number" min="1" th:field="*{perUserUsageLimit}"></div><div class="col-md-4"><label class="form-label">Phạm vi</label><select class="form-select" th:field="*{scopeType}" data-voucher-scope><option th:each="x:${scopeTypes}" th:value="${x}" th:text="${x.displayName}"></option></select></div>
<div class="col-12" data-scope-target="CATEGORY"><label class="form-label">Danh mục áp dụng</label><select class="form-select" multiple size="6" th:field="*{targetIds}"><option th:each="x:${categories}" th:value="${x.id}" th:text="${x.name}"></option></select></div><div class="col-12" data-scope-target="BRAND"><label class="form-label">Thương hiệu áp dụng</label><select class="form-select" multiple size="6" th:field="*{targetIds}"><option th:each="x:${brands}" th:value="${x.id}" th:text="${x.name}"></option></select></div><div class="col-12" data-scope-target="PRODUCT"><label class="form-label">Sản phẩm áp dụng</label><select class="form-select" multiple size="10" th:field="*{targetIds}"><option th:each="x:${products}" th:value="${x.id}" th:text="${x.sku+' - '+x.name}"></option></select></div><div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{status}"><label class="form-check-label">Kích hoạt</label></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/admin/discounts}">Hủy</a><button class="btn btn-primary">Lưu voucher</button></div></form>
</div></main><footer th:replace="~{admin/fragments :: footer}"></footer></div></div><script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script><script th:src="@{/admin/js/main.js}"></script><script>const scope=document.querySelector('[data-voucher-scope]');function sync(){document.querySelectorAll('[data-scope-target]').forEach(x=>{const on=x.dataset.scopeTarget===scope.value;x.hidden=!on;x.querySelectorAll('select').forEach(s=>s.disabled=!on);});}scope.addEventListener('change',sync);sync();</script></body></html>
