<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Vegetable Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center py-5">
        <div class="col-md-7 col-lg-5">
            <div class="bg-white rounded shadow-sm p-4 p-md-5">
                <a th:href="@{/}" href="/" class="text-decoration-none">
                    <h2 class="text-primary text-center mb-4">Vegetable Shop</h2>
                </a>
                <h4 class="text-center mb-4">Đăng nhập</h4>

                <div th:if="${param.registered}" class="alert alert-success">
                    Đăng ký thành công. Bạn có thể đăng nhập ngay bây giờ.
                </div>
                <div th:if="${param.error}" class="alert alert-danger">
                    Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    Bạn đã đăng xuất thành công.
                </div>

                <form th:action="@{/login}" action="/login" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" name="email" type="email" class="form-control py-3"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input id="password" name="password" type="password" class="form-control py-3"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary text-white w-100 py-3">Đăng nhập</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Chưa có tài khoản?
                    <a th:href="@{/register}" href="/register">Đăng ký</a>
                </p>
                <p class="text-center mt-3 mb-0">
                    <a th:href="@{/shop}" href="/shop">Quay lại cửa hàng</a>
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
