<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#31404b">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px">
    <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0"
               style="max-width:600px;background:#fff;border-radius:12px;overflow:hidden">
            <tr><td style="background:#74c900;color:#fff;padding:24px 32px;font-size:26px;font-weight:bold">Vegetable Shop</td></tr>
            <tr><td style="padding:32px">
                <h2 style="margin-top:0">Kích hoạt tài khoản</h2>
                <p>Xin chào <strong th:text="${fullName}">Khách hàng</strong>,</p>
                <p>Cảm ơn bạn đã đăng ký. Nhấn nút dưới đây để xác minh email và kích hoạt tài khoản.</p>
                <p style="margin:28px 0">
                    <a th:href="${activationUrl}" href="#"
                       style="background:#74c900;color:#fff;text-decoration:none;padding:14px 24px;border-radius:8px;display:inline-block">
                        Kích hoạt tài khoản
                    </a>
                </p>
                <p style="font-size:13px;color:#6c757d">Liên kết có hiệu lực trong 24 giờ và chỉ sử dụng được một lần.</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
