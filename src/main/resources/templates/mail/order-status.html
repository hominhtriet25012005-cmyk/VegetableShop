<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#31404b">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px">
    <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0"
               style="max-width:600px;background:#fff;border-radius:12px;overflow:hidden">
            <tr><td style="background:#74c900;color:#fff;padding:24px 32px;font-size:26px;font-weight:bold">Vegetable Shop</td></tr>
            <tr><td style="padding:32px">
                <h2 style="margin-top:0">Cập nhật trạng thái đơn hàng</h2>
                <p>Xin chào <strong th:text="${order.fullName}">Khách hàng</strong>,</p>
                <p>Đơn <strong th:text="${order.orderCode}">VS-001</strong> đã chuyển sang trạng thái:</p>
                <p style="font-size:22px;color:#5a9e00;font-weight:bold" th:text="${statusLabel}">Đã xác nhận</p>
                <p style="margin:28px 0"><a th:href="${orderUrl}" href="#" style="background:#74c900;color:#fff;text-decoration:none;padding:14px 24px;border-radius:8px;display:inline-block">Theo dõi đơn hàng</a></p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
