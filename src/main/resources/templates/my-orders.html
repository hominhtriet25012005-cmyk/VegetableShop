<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đơn hàng của tôi - Vegetable Shop</title><link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"><link th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet"></head>
<body>
<div class="container-fluid fixed-top bg-white shadow-sm"><div class="container px-0"><nav class="navbar navbar-light navbar-expand-xl"><a th:href="@{/}" class="navbar-brand"><h1 class="text-primary display-6">Vegetable Shop</h1></a><div th:replace="~{fragments/navigation :: mainMenu('orders')}"></div><div class="d-flex"><div th:replace="~{fragments/cart-link :: cartLink}"></div><div th:replace="~{fragments/account :: accountMenu}"></div></div></nav></div></div>
<div class="container-fluid page-header py-5"><h1 class="text-center text-white display-6">Đơn hàng của tôi</h1></div>
<main class="container py-5">
    <div th:if="${#lists.isEmpty(orders)}" class="text-center bg-light rounded p-5"><i class="fas fa-receipt fa-4x text-primary mb-4"></i><h2 class="h4">Bạn chưa có đơn hàng nào</h2><a th:href="@{/shop}" class="btn btn-primary text-white rounded-pill px-5 py-3 mt-3">Mua sắm ngay</a></div>
    <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Sản phẩm</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td class="fw-semibold" th:text="${order.orderCode}">VS-...</td><td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td><td th:text="${#lists.size(order.details)}">1</td><td class="text-primary fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}">0 ₫</td><td><span class="badge bg-secondary" th:text="${order.status}">PENDING</span></td><td><a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-primary btn-sm">Xem chi tiết</a></td></tr></tbody></table></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
