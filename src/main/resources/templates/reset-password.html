<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Vegetable Shop</title>
    <link th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center py-5">
        <div class="col-md-7 col-lg-5">
            <div class="bg-white rounded shadow-sm p-4 p-md-5">
                <a th:href="@{/}" href="/" class="text-decoration-none">
                    <h2 class="text-primary text-center mb-4">Vegetable Shop</h2>
                </a>
                <h4 class="text-center mb-4">Đặt lại mật khẩu</h4>

                <div th:if="${invalidToken}" class="alert alert-danger">
                    Liên kết không hợp lệ, đã được sử dụng hoặc đã hết hạn.
                    <a th:href="@{/forgot-password}" href="/forgot-password">Tạo yêu cầu mới</a>.
                </div>

                <form th:unless="${invalidToken}" th:action="@{/reset-password}"
                      th:object="${resetPasswordRequest}" method="post" novalidate>
                    <input type="hidden" th:field="*{token}">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Lỗi token</div>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Mật khẩu mới</label>
                        <input id="newPassword" type="password" th:field="*{newPassword}"
                               class="form-control py-3"
                               th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{newPassword}">Lỗi mật khẩu</div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                               class="form-control py-3"
                               th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('passwordConfirmed')} ? ' is-invalid'"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}">Vui lòng xác nhận mật khẩu</div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordConfirmed')}"
                             th:errors="*{passwordConfirmed}">Mật khẩu không khớp</div>
                    </div>
                    <button type="submit" class="btn btn-primary text-white w-100 py-3">Đặt lại mật khẩu</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    <a th:href="@{/login}" href="/login">Quay lại đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
